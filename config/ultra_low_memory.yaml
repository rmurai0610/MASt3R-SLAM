use_calib: False
single_thread: True  # Use single thread to reduce memory usage
dataset:
  subsample: 5  # Process every 5th frame to reduce memory significantly
  img_downsample: 3  # Downsample images by factor of 3 (640x360 instead of 1920x1080)
  center_principle_point: True

matching:
  max_iter: 5  # Reduced iterations
  lambda_init: 1e-8
  convergence_thresh: 1e-6
  dist_thresh: 1e-1 # distance in 3D space
  radius: 2  # Reduced radius
  dilation_max: 3 # Reduced max dilation

tracking:
  min_match_frac: 0.05
  max_iters: 25  # Reduced iterations
  C_conf: 0.0
  Q_conf: 1.5
  rel_error: 1e-3
  delta_norm: 1e-3
  huber: 1.345
  match_frac_thresh: 0.333
  sigma_ray: 0.003
  sigma_dist: 1e+1
  sigma_pixel: 1.0
  sigma_depth: 1e+1 # NOTE: log-depth!
  sigma_point: 0.05
  pixel_border: -10 # Only in calib (negative means allow pixels outside image up to that distance)
  depth_eps: 1e-6 # Only in calib case
  filtering_mode: weighted_pointmap # recent, first, best_score, weighted_pointmap, weighted_spherical, indep_conf
  filtering_score: median # median, mean (only used for filtering_mode=best_score)

local_opt:
  pin: 1
  window_size: 1e+4  # Very small window size to save memory   
  C_conf: 0.0
  Q_conf: 1.5
  min_match_frac: 0.1
  pixel_border: -10 # Only in calib (negative means allow pixels outside image up to that distance)
  depth_eps: 1e-6 # Only in calib case
  max_iters: 5  # Reduced iterations
  sigma_ray: 0.003
  sigma_dist: 1e+1
  sigma_pixel: 1.0
  sigma_depth: 1e+1 # NOTE: log-depth!
  sigma_point: 0.05
  delta_norm: 1e-8
  use_cuda: True

retrieval:
  k: 1  # Minimal retrieval to save memory
  min_thresh: 1e-2  # Higher threshold to reduce matches

reloc:
  min_match_frac: 0.3
  strict: True