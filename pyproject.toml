[build-system]
# torch pinned to match setup.bat's install (torch==2.7.0+cu128) -- an
# unpinned "torch" here resolves from default PyPI (CPU-only on Windows)
# during an isolated build, clobbering the venv's CUDA torch if this
# package or lietorch is ever reinstalled without --no-build-isolation.
requires = ["setuptools==70.0.0", "torch==2.7.0"]
build-backend = "setuptools.build_meta"

[project]
name = "MAST3R-SLAM"
version = "0.0.1"
dependencies = [
    "numpy==1.26.4",
    "einops",
    "pyrealsense2",
    "evo",
    "natsort",
    # "torchcodec==0.1",
    "lietorch @ git+https://github.com/princeton-vl/lietorch.git",
    "plyfile",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mast3r_slam"]
namespaces = false
